name: trace_life
description: "迹录 - 个人生活轨迹记录工具"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State Management
  flutter_riverpod: ^2.5.0

  # Local Database
  sqflite: ^2.4.2
  path_provider: ^2.1.5

  # Data Models
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0

  # Routing
  go_router: ^14.0.0

  # UI
  table_calendar: ^3.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true
